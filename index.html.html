<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Made by LA | Creative Portfolio</title>
    
    <!-- Google Fonts for High-End Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 300vh;
        }

        /* 3D WebGL Canvas Fixed Background */
        #webgl-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Scroll Sections Layout */
        section {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 10%;
            position: relative;
            text-align: center;
        }

        /* Section 1: Hero */
        .hero-content h1 {
            font-size: clamp(3rem, 8vw, 7rem);
            font-weight: 900;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            line-height: 0.9;
            margin-bottom: 20px;
            background: linear-gradient(180deg, #ffffff 0%, #aaaaaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-content p {
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #00ffe0;
        }

        /* Section 2: About / Skills */
        .about-content h2 {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: -0.02em;
        }

        .about-content p {
            font-size: clamp(1rem, 1.8vw, 1.25rem);
            max-width: 600px;
            line-height: 1.6;
            color: #cccccc;
            font-weight: 300;
        }

        /* Section 3: Contact */
        .contact-content h2 {
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 900;
            margin-bottom: 40px;
            letter-spacing: -0.03em;
        }

        .social-links {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .social-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            transition: all 0.4s ease;
        }

        .social-links a:hover {
            background-color: #00ffe0;
            color: #000000;
            border-color: #00ffe0;
            box-shadow: 0 0 20px rgba(0, 255, 224, 0.4);
        }

        /* Fade class for initial GSAP state */
        .gsap-fade {
            opacity: 0;
            transform: translateY(40px);
        }
    </style>
</head>
<body>

    <!-- Target Canvas for Three.js -->
    <canvas id="webgl-bg"></canvas>

    <!-- Section 1: Hero -->
    <section id="hero">
        <div class="hero-content gsap-fade">
            <h1>MADE BY LA</h1>
            <p>Creative Developer & Designer</p>
        </div>
    </section>

    <!-- Section 2: About / Skills -->
    <section id="about">
        <div class="about-content gsap-fade">
            <h2>Crafting Digital Dimensions</h2>
            <p>I merge mathematical logic with pixel-perfect design to create immersive, high-performance web experiences that live in the intersection of art and code.</p>
        </div>
    </section>

    <!-- Section 3: Contact -->
    <section id="contact">
        <div class="contact-content gsap-fade">
            <h2>Let's Connect!</h2>
            <div class="social-links">
                <a href="mailto:your-email@example.com">Email</a>
                <a href="https://github.com" target="_blank">GitHub</a>
                <a href="https://linkedin.com" target="_blank">LinkedIn</a>
            </div>
        </div>
    </section>

    <!-- CDN Libraries (Three.js and GSAP + ScrollTrigger) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        // Register GSAP ScrollTrigger
        gsap.registerPlugin(ScrollTrigger);

        // --- Three.js Setup ---
        const canvas = document.querySelector('#webgl-bg');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 4;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // --- Particle Setup ---
        const particleCount = 15000;
        
        // Define Arrays for Shapes
        const spherePositions = new Float32Array(particleCount * 3);
        const torusPositions = new Float32Array(particleCount * 3);
        const wavePositions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            // 1. Sphere Math (State 1)
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 1.4 + Math.random() * 0.15;
            spherePositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            spherePositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            spherePositions[i * 3 + 2] = r * Math.cos(phi);

            // 2. Torus Math (State 2)
            const rTorus = 0.35; 
            const RTorus = 1.1; 
            const uT = Math.random() * 2 * Math.PI;
            const vT = Math.random() * 2 * Math.PI;
            torusPositions[i * 3] = (RTorus + rTorus * Math.cos(vT)) * Math.cos(uT);
            torusPositions[i * 3 + 1] = (RTorus + rTorus * Math.cos(vT)) * Math.sin(uT);
            torusPositions[i * 3 + 2] = rTorus * Math.sin(vT);

            // 3. Wave/Plane Math (State 3)
            wavePositions[i * 3] = (Math.random() - 0.5) * 5.0; 
            wavePositions[i * 3 + 1] = (Math.random() - 0.5) * 5.0; 
            wavePositions[i * 3 + 2] = (Math.random() - 0.5) * 0.2; 
        }

        // Create Custom Buffer Geometry
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(spherePositions, 3));
        geometry.setAttribute('aTorus', new THREE.BufferAttribute(torusPositions, 3));
        geometry.setAttribute('aWave', new THREE.BufferAttribute(wavePositions, 3));

        // --- Custom GLSL Shaders for Morphing ---
        const vertexShader = `
            uniform float uProgress;
            uniform float uTime;
            attribute vec3 aTorus;
            attribute vec3 aWave;
            varying vec3 vPosition;

            void main() {
                vec3 mixedPos = position;

                // Phase 1: Sphere to Torus (uProgress from 0.0 to 1.0)
                float t1 = clamp(uProgress, 0.0, 1.0);
                mixedPos = mix(mixedPos, aTorus, t1);

                // Phase 2: Torus to Wave (uProgress from 1.0 to 2.0)
                float t2 = clamp(uProgress - 1.0, 0.0, 1.0);
                
                // Add fluid dynamic sine wave motion to the wave coordinates
                vec3 customWave = aWave;
                if(t2 > 0.0) {
                    customWave.z += sin(customWave.x * 2.5 + uTime) * 0.25;
                    customWave.z += cos(customWave.y * 2.0 + uTime) * 0.25;
                }
                mixedPos = mix(mixedPos, customWave, t2);

                // Gentle idle breathing noise for floating animation effect
                mixedPos.x += sin(uTime * 0.3 + position.y) * 0.03;
                mixedPos.y += cos(uTime * 0.4 + position.x) * 0.03;

                vec4 mvPosition = modelViewMatrix * vec4(mixedPos, 1.0);
                gl_Position = projectionMatrix * mvPosition;

                // Dynamic sizing based on viewport distance
                gl_PointSize = 7.0 * (2.5 / -mvPosition.z);
            }
        `;

        const fragmentShader = `
            void main() {
                // Perfect smooth glowing circles instead of generic squares
                float dist = distance(gl_PointCoord, vec2(0.5));
                if (dist > 0.5) discard;
                
                float alpha = smoothstep(0.5, 0.1, dist);
                
                // Neon Cyan Color Mix Map (#00ffe0)
                gl_FragColor = vec4(0.0, 1.0, 0.88, alpha * 0.85);
            }
        `;

        // Shader Material Integration
        const uniforms = {
            uProgress: { value: 0.0 },
            uTime: { value: 0.0 }
        };

        const material = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            uniforms: uniforms,
            transparent: true,
            depthTest: false,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // --- Mouse Interaction System ---
        let targetMouseX = 0;
        let targetMouseY = 0;
        let currentMouseX = 0;
        let currentMouseY = 0;

        window.addEventListener('mousemove', (event) => {
            targetMouseX = (event.clientX / window.innerWidth) - 0.5;
            targetMouseY = (event.clientY / window.innerHeight) - 0.5;
        });

        // --- GSAP Scroll Animations Orchestration ---
        
        // 1. Particle State Morphing Control via Progress
        gsap.to(uniforms.uProgress, {
            value: 2.0,
            ease: "none",
            scrollTrigger: {
                trigger: "body",
                start: "top top",
                end: "bottom bottom",
                scrub: 1.2
            }
        });

        // 2. Continuous Particle System Rotation Sync
        gsap.to(particleSystem.rotation, {
            y: Math.PI * 2,
            ease: "none",
            scrollTrigger: {
                trigger: "body",
                start: "top top",
                end: "bottom bottom",
                scrub: 1
            }
        });

        // 3. Dom Typography Text Fade Effects
        const sections = document.querySelectorAll('section');
        sections.forEach((section) => {
            const content = section.querySelector('.gsap-fade');
            
            gsap.fromTo(content, 
                { opacity: 0, y: 40 },
                { 
                    opacity: 1, 
                    y: 0, 
                    duration: 1,
                    scrollTrigger: {
                        trigger: section,
                        start: "top 60%",
                        end: "top 20%",
                        toggleActions: "play reverse play reverse"
                    }
                }
            );
        });

        // --- Window Resize Adaptation ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        // --- Animation Render Loop ---
        const clock = new THREE.Clock();

        const tick = () => {
            const elapsedTime = clock.getElapsedTime();
            uniforms.uTime.value = elapsedTime;

            // Smooth Mouse Follower Interpolation (Lerp)
            currentMouseX += (targetMouseX - currentMouseX) * 0.05;
            currentMouseY += (targetMouseY - currentMouseY) * 0.05;

            // Inject mouse sway vectors based on global morph coordinates
            particleSystem.rotation.x = currentMouseY * 0.4;
            // Base timeline offset rotation
            if (uniforms.uProgress.value > 1.0) {
                // Look down slightly during wave phase
                particleSystem.rotation.x += 0.6; 
            }

            renderer.render(scene, camera);
            window.requestAnimationFrame(tick);
        };

        tick();
    </script>
</body>
</html>
